<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WYVE</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080C14;--s1:#0d1422;--s2:#141e33;--line:#1c2742;--a:#38BDF8;--a2:#7DD3FC;--t:#e6edf7;--m:#7f8ba3}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.4 Sora,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#app{display:grid;grid-template-columns:232px 1fr auto;grid-template-rows:1fr 88px;height:100vh;height:100dvh}
#side{background:var(--s1);border-right:1px solid var(--line);padding:20px 12px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:12px;padding:0 10px 18px;font-weight:700;letter-spacing:.18em;font-size:16px}
#side nav button,.pls button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:8px;color:var(--m);text-align:left;font-weight:600}
#side nav button:hover,.pls button:hover{color:var(--t);background:var(--s2)}#side nav button.act{color:var(--a2);background:var(--s2)}
.pls{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.pls button{font-weight:400;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#main{overflow:auto;padding:0 28px 28px;background:linear-gradient(180deg,#0b1730 0,var(--bg) 320px)}
#top{position:sticky;top:0;z-index:5;display:flex;gap:12px;padding:16px 0;background:linear-gradient(var(--bg) 40%,transparent)}
.sbox{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:0 16px;color:var(--m)}
.sbox:focus-within{border-color:var(--a)}#q{flex:1;background:none;border:0;color:var(--t);padding:11px 0;font:inherit;outline:0}
h1{font-size:30px;letter-spacing:-.02em;margin:8px 0 18px}h2{font-size:18px;margin:26px 0 12px}
.grid,.shelf{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{padding:10px;border-radius:12px;cursor:pointer;min-width:0}.card:hover{background:var(--s2)}
.card .img{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--s2);margin-bottom:10px}
.card img{width:100%;height:100%;object-fit:cover}.pb{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--a);color:#04121f;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.15s}
.card:hover .pb{opacity:1;transform:none}.card b,.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.card span,.meta span{color:var(--m);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plart{display:grid;place-items:center;height:100%;background:linear-gradient(135deg,#0c4a6e,#0a1224);color:var(--a2);font-size:34px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer}.row:hover{background:var(--s2)}.row.now .meta b{color:var(--a)}
.row img{width:44px;height:44px;border-radius:6px;object-fit:cover}.meta{flex:1;min-width:0}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--m)}.ib:hover{color:var(--t)}.ib.on{color:var(--a)}.ib.on svg path{fill:currentColor}
.empty{color:var(--m);padding:18px 0}.empty button,.btn{color:var(--a2);text-decoration:underline}
.hd{display:flex;gap:22px;align-items:flex-end;margin:8px 0 22px}.hd .cover{width:150px;height:150px;border-radius:12px;overflow:hidden;flex:none}.hd h1{margin:0 0 6px}.acts{display:flex;gap:14px;align-items:center;margin-top:14px}
.big{width:52px;height:52px;border-radius:50%;background:var(--a);color:#04121f;display:grid;place-items:center}
#bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:0 16px;background:var(--s1);border-top:1px solid var(--line)}
.np{display:flex;align-items:center;gap:12px;min-width:0}.np img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--s2)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:6px}.btns{display:flex;align-items:center;gap:10px}
.btns .big{width:40px;height:40px}.prog{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;color:var(--m);font-size:11px;font-variant-numeric:tabular-nums}
.right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--a2) var(--p,0%),var(--line) var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--t)}input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--t)}
#vol{flex:none;width:96px}
#panel{width:0;overflow:hidden;background:var(--s1);border-left:1px solid var(--line);transition:width .2s}#panel.open{width:340px}
.pin{width:340px;height:100%;display:flex;flex-direction:column}.tabs{display:flex;gap:6px;padding:14px;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 14px;border-radius:999px;color:var(--m);font-weight:600}.tabs button.act{background:var(--s2);color:var(--a2)}#pbody{flex:1;overflow:auto;padding:10px}
.ly{white-space:pre-wrap;font:inherit;line-height:1.8;padding:8px;color:#cfe3f5}
#yt{position:fixed;left:-400px;bottom:0;width:200px;height:200px;pointer-events:none}
#menu{position:fixed;z-index:20;display:none;min-width:220px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 40px #000a}#menu.on{display:block}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:6px}#menu button:hover{background:var(--line)}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);background:var(--a);color:#04121f;padding:9px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr 150px}#side{flex-direction:row;overflow:auto;padding:8px;border:0;border-bottom:1px solid var(--line)}.logo{padding:0 8px}#side nav{display:flex}#side nav button{width:auto;white-space:nowrap}#side nav button span,.pls{display:none}
#main{padding:0 14px 14px}#bar{grid-template-columns:1fr;gap:4px;padding:8px 12px}.right{display:none}#panel{position:fixed;inset:0 0 150px 0;z-index:10;width:0}#panel.open,.pin{width:100%}.hd{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app">
<aside id="side"><div class="logo"><svg width="46" height="22" viewBox="0 0 46 22" fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linejoin="miter" aria-label="WF"><defs><linearGradient id="g"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient></defs><path d="M2 2L8 20L14 8L20 20L26 2M32 2V20M32 2H44M32 10.5H41"/></svg>WYVE</div>
<nav><button data-v="home"></button><button data-v="search"></button><button data-v="library"></button><button data-v="liked"></button><button data-a="newpl"></button></nav><div class="pls" id="sidepl"></div></aside>
<main id="main"><header id="top"><label class="sbox"><span id="si"></span><input id="q" type="search" placeholder="Search songs or artists" autocomplete="off"></label><button class="ib" id="keyb" title="YouTube API key (optional)" data-a="key"></button><button class="btn" id="srcb" data-a="src" title="Switch music source" style="white-space:nowrap;padding:0 8px"></button></header><div id="view"></div></main>
<aside id="panel"><div class="pin"><div class="tabs"><button data-t="queue">Queue</button><button data-t="lyrics">Lyrics</button></div><div id="pbody"></div></div></aside>
<footer id="bar"><div class="np"><img id="art" alt=""><div class="meta"><b id="nt">Nothing playing</b><span id="na">Search for a song to start</span></div><button class="ib" id="nl" data-a="likecur" aria-label="Like"></button></div>
<div class="ctr"><div class="btns"><button class="ib" id="shuf" aria-label="Shuffle"></button><button class="ib" id="prev" aria-label="Previous"></button><button class="big" id="pp" aria-label="Play or pause"></button><button class="ib" id="next" aria-label="Next"></button><button class="ib" id="rep" aria-label="Repeat"></button></div>
<div class="prog"><span id="tc">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek"><span id="td">0:00</span></div></div>
<div class="right"><button class="ib" data-t="lyrics" id="lb" aria-label="Lyrics"></button><button class="ib" data-t="queue" id="qb" aria-label="Queue"></button><span id="vi"></span><input id="vol" type="range" min="0" max="100" aria-label="Volume"></div></footer></div>
<audio id="au"></audio><div id="yt"></div><div id="menu"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>document.createElement(s);
const P={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>',next:'<path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/>',prev:'<path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/>',
shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3" fill="none" stroke="currentColor" stroke-width="2"/>',
heart:'<path fill="none" stroke="currentColor" stroke-width="2" d="M12 20.5C5 15 3 12 3 8.8A4.8 4.8 0 0112 7a4.8 4.8 0 019 1.8c0 3.200-2 6.200-9 11.700z"/>',
home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',search:'<path fill="none" stroke="currentColor" stroke-width="2" d="M10.500 17a6.500 6.500 0 100-13 6.500 6.500 0 000 13zM15.500 15.500L21 21"/>',
lib:'<path d="M4 4h3v16H4zM9 4h3v16H9zM14.500 5l3-1 3.500 15-3 1z"/>',plus:'<path d="M11 5h2v14h-2zM5 11h14v2H5z"/>',lyr:'<path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h10v2H4z"/>',
queue:'<path d="M3 6h13v2H3zM3 11h13v2H3zM3 16h9v2H3zM18 11v7l4-3.500z"/>',more:'<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>',
vol:'<path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.500 8.500a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2"/>',key:'<path fill="none" stroke="currentColor" stroke-width="2" d="M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-2-4-2 .5-1.500-1V4h-4v2.500l-1.500 1L7 7l-2 4 2 1v1.800L5 15l2 4 2-.5 1.500 1V22h4v-2.500l1.500-1 2 .5 2-4-2-1z"/>'};
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=s=>{const t=E('textarea');t.innerHTML=s;return t.value},th=t=>t.id.startsWith('a:')?(t.img||''):`https://i.ytimg.com/vi/${t.id}/mqdefault.jpg`;
const fmt=s=>{s=s|0;return(s/60|0)+':'+String(s%60).padStart(2,'0')};
let S={liked:[],pl:[],recent:[],queue:[],idx:-1,vol:70,shuffle:false,repeat:0,key:'',src:'yt'};
try{Object.assign(S,JSON.parse(localStorage.getItem('wyve.v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('wyve.v1',JSON.stringify(S))}catch(e){}};
const au=$('#au'),isAu=t=>!!t&&t.id.startsWith('a:'),pos=()=>isAu(cur())?au.currentTime:(ready?yt.getCurrentTime():0),seekTo=x=>isAu(cur())?(au.currentTime=x):(ready&&yt.seekTo(x,true)),updSrc=()=>$('#srcb').textContent='Source: '+(S.src==='au'?'Audius':'YouTube'),cur=()=>S.queue[S.idx],isLiked=id=>S.liked.some(t=>t.id===id);
let L={},view={n:'home'},playing=false,ready=false,pend=null,yt,drag=false,tab='queue',panelOpen=false,menuT=null,menuL=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- search ---------- */
const SC=new Map(),PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee'],INV=['https://inv.nadeko.net','https://yewtu.be'];
const J=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(7000)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
async function ytSearch(q){
 if(SC.has(q))return SC.get(q);let out;const e=encodeURIComponent(q);
 if(S.key)try{const j=await J(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=24&q=${e}&key=${S.key}`);out=j.items.map(i=>({id:i.id.videoId,title:dec(i.snippet.title),artist:dec(i.snippet.channelTitle).replace(/ - Topic$/,'')}))}catch(x){toast('YouTube API key failed, using public sources')}
 if(!out||!out.length)for(const h of PIPED)try{const j=await J(`${h}/search?q=${e}&filter=music_songs`);out=(j.items||[]).filter(x=>(x.url||'').includes('v=')).map(x=>({id:x.url.split('v=')[1].split('&')[0],title:x.title,artist:(x.uploaderName||'').replace(/ - Topic$/,'')}));if(out.length)break}catch(x){}
 if(!out||!out.length)for(const h of INV)try{const j=await J(`${h}/api/v1/search?q=${e}&type=video`);out=j.filter(x=>x.type==='video').map(x=>({id:x.videoId,title:x.title,artist:x.author}));if(out.length)break}catch(x){}
 if(!out||!out.length)throw new Error('No search source responded.');
 SC.set(q,out);return out}
let AUH;
async function auHost(){if(AUH)return AUH;const j=await J('https://api.audius.co');AUH=j.data[Math.random()*j.data.length|0];return AUH}
async function auSearch(q){try{const h=await auHost(),j=await J(`${h}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=WYVE&limit=24`);return j.data.filter(x=>x.is_streamable!==false).map(x=>({id:'a:'+x.id,title:x.title,artist:x.user.name,img:(x.artwork||{})['480x480']||'',host:h}))}catch(e){AUH=null;throw e}}
async function search(q){const k=S.src+q;if(SC.has(k))return SC.get(k);let out;
 if(S.src==='au')try{out=await auSearch(q)}catch(e){}
 if(!out||!out.length)try{out=await ytSearch(q)}catch(e){if(S.src!=='au')try{out=await auSearch(q);if(out.length)toast('YouTube unavailable, showing Audius results')}catch(x){}}
 if(!out||!out.length)throw new Error('No search source responded.');SC.set(k,out);return out}
async function load(t){if(isAu(t)){ready&&yt.stopVideo();const h=t.host||await auHost();au.src=`${h}/v1/tracks/${t.id.slice(2)}/stream?app_name=WYVE`;au.play().catch(()=>{})}else{au.pause();if(ready)yt.loadVideoById(t.id);else pend=t.id}}
const errBox=e=>`<div class="empty">Couldn’t load results. ${esc(e.message)} <button data-a="key">Add a YouTube API key</button> or try again.</div>`;

/* ---------- views ---------- */
const card=(t,l,i)=>`<div class="card" data-a="play" data-l="${l}" data-i="${i}"><div class="img"><img loading="lazy" src="${th(t)}" alt=""><span class="pb">${ic('play',22)}</span></div><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div>`;
const rows=(list,l)=>list.map((t,i)=>`<div class="row${cur()&&cur().id===t.id?' now':''}" data-a="play" data-l="${l}" data-i="${i}"><img src="${th(t)}" alt=""><div class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div><button class="ib${isLiked(t.id)?' on':''}" data-a="like" data-l="${l}" data-i="${i}" aria-label="Like">${ic('heart',18)}</button><button class="ib" data-a="menu" data-l="${l}" data-i="${i}" aria-label="More">${ic('more',18)}</button></div>`).join('');
const plCard=p=>`<div class="card" data-a="openpl" data-id="${p.id}"><div class="img"><div class="plart">${esc(p.name[0].toUpperCase())}</div></div><b>${esc(p.name)}</b><span>${p.tracks.length} songs</span></div>`;
const SHELVES=[['Trending now','top music hits 2026'],['Focus','lofi beats to study'],['After dark','chill r&b songs']];
function go(n,a){view={n,a};render();$('#main').scrollTop=0}
function render(){
 const v=$('#view'),{n,a}=view;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('act',b.dataset.v===n));
 if(n==='home'){L.recent=S.recent;v.innerHTML=`<h1>Home</h1>${S.recent.length?`<h2>Recently played</h2><div class="grid">${S.recent.slice(0,6).map((t,i)=>card(t,'recent',i)).join('')}</div>`:''}`+SHELVES.map((s,k)=>`<h2>${s[0]}</h2><div class="shelf" id="sh${k}"><div class="empty">Loading…</div></div>`).join('');
  SHELVES.forEach(async(s,k)=>{try{const r=await search(s[1]);L['h'+k]=r;const el=$('#sh'+k);if(el&&view.n==='home')el.innerHTML=r.slice(0,6).map((t,i)=>card(t,'h'+k,i)).join('')}catch(e){const el=$('#sh'+k);if(el)el.innerHTML=errBox(e)}})}
 else if(n==='search')searchView(v);
 else if(n==='library')v.innerHTML=`<h1>Your Library</h1><div class="grid"><div class="card" data-v="liked" data-a="nav"><div class="img"><div class="plart">${ic('heart',48)}</div></div><b>Liked Songs</b><span>${S.liked.length} songs</span></div>${S.pl.map(plCard).join('')}<div class="card" data-a="newpl"><div class="img"><div class="plart">${ic('plus',48)}</div></div><b>Create playlist</b></div></div>`;
 else if(n==='liked'){L.liked=S.liked;v.innerHTML=head('Liked Songs',S.liked.length,'liked',ic('heart',56),'')+(S.liked.length?rows(S.liked,'liked'):'<p class="empty">Tap the heart on any song to save it here.</p>')}
 else if(n==='pl'){const p=S.pl.find(x=>x.id===a);if(!p)return go('library');L.pl=p.tracks;v.innerHTML=head(p.name,p.tracks.length,'pl',esc(p.name[0].toUpperCase()),`<button class="btn" data-a="ren">Rename</button><button class="btn" data-a="del">Delete</button>`)+(p.tracks.length?rows(p.tracks,'pl'):'<p class="empty">Empty playlist. Use the ⋯ menu on any song to add it here.</p>')}
 side()}
const head=(t,n,l,art,extra)=>`<div class="hd"><div class="cover"><div class="plart">${art}</div></div><div><h1>${esc(t)}</h1><span class="empty" style="padding:0">${n} songs</span><div class="acts"><button class="big" data-a="playall" data-l="${l}" aria-label="Play">${ic('play',24)}</button>${extra}</div></div></div>`;
async function searchView(v){const q=view.q||'';
 if(!q){v.innerHTML='<h1>Search</h1><p class="empty">Type a song or artist. Results update as you type.</p>';return}
 v.innerHTML=`<h1>Results for “${esc(q)}”</h1><div id="res" class="empty">Searching…</div>`;
 try{const r=await search(q);if(view.n!=='search'||view.q!==q)return;L.s=r;$('#res').outerHTML=`<div class="grid">${r.map((t,i)=>card(t,'s',i)).join('')}</div>`}catch(e){if(view.q===q&&$('#res'))$('#res').innerHTML=errBox(e)}}
function side(){$('#sidepl').innerHTML=S.pl.map(p=>`<button data-a="openpl" data-id="${p.id}">${esc(p.name)}</button>`).join('')}

/* ---------- player ---------- */
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{height:'200',width:'200',playerVars:{playsinline:1,controls:0},events:{onReady:()=>{ready=true;yt.setVolume(S.vol);if(pend){yt.loadVideoById(pend);pend=null}},onStateChange:e=>{if(isAu(cur()))return;if(e.data===1)playing=true;else if(e.data===2)playing=false;else if(e.data===0){playing=false;S.repeat===2?(yt.seekTo(0),yt.playVideo()):next(true)}setPlay()},onError:()=>{toast('Track unavailable, skipping');next(true)}}})};
function playList(l,i){const list=L[l];if(!list||!list.length)return;S.queue=list.slice();playAt(i)}
function playAt(i){S.idx=i;const t=cur();if(!t)return;S.recent=[t,...S.recent.filter(x=>x.id!==t.id)].slice(0,12);save();load(t);ui();if(panelOpen&&tab==='lyrics')lyrics()}
function next(auto){const n=S.queue.length;if(!n)return;let i;if(S.shuffle&&n>1){do{i=Math.random()*n|0}while(i===S.idx)}else{i=S.idx+1;if(i>=n){if(S.repeat===1||!auto)i=0;else{playing=false;ready&&yt.stopVideo();au.pause();setPlay();return}}}playAt(i)}
function prev(){if(!cur())return;if(pos()>3)seekTo(0);else playAt(S.idx>0?S.idx-1:S.queue.length-1)}
function toggle(){if(!cur())return;if(isAu(cur())){au.paused?au.play():au.pause();return}if(!ready)return;playing?yt.pauseVideo():yt.playVideo()}
const setPlay=()=>$('#pp').innerHTML=ic(playing?'pause':'play',22);
function ui(){const t=cur();$('#nt').textContent=t?t.title:'Nothing playing';$('#na').textContent=t?t.artist:'Search for a song to start';$('#art').src=t?th(t):'';$('#art').style.visibility=t?'visible':'hidden';
 $('#nl').classList.toggle('on',!!t&&isLiked(t.id));$('#shuf').classList.toggle('on',S.shuffle);$('#rep').classList.toggle('on',S.repeat>0);$('#rep').innerHTML=ic('repeat')+(S.repeat===2?'<b style="position:absolute;font-size:9px;margin:-2px 0 0 -14px">1</b>':'');
 document.querySelectorAll('.row').forEach(r=>{const x=(L[r.dataset.l]||[])[r.dataset.i];r.classList.toggle('now',!!x&&!!t&&x.id===t.id)});document.title=t?t.title+' · WYVE':'WYVE';setPlay();if(panelOpen&&tab==='queue')panel()}
setInterval(()=>{const t=cur();if(!t||drag||(!isAu(t)&&!(ready&&yt.getDuration)))return;const A=isAu(t),d=(A?au.duration:yt.getDuration())||0,c=(A?au.currentTime:yt.getCurrentTime())||0;if(d&&isFinite(d)){const k=$('#seek');k.max=d;k.value=c;fill(k);$('#tc').textContent=fmt(c);$('#td').textContent=fmt(d)}},400);
const fill=el=>el.style.setProperty('--p',(el.value/el.max*100||0)+'%');
$('#seek').oninput=e=>{drag=true;fill(e.target);$('#tc').textContent=fmt(e.target.value)};$('#seek').onchange=e=>{seekTo(+e.target.value);drag=false};
$('#vol').value=S.vol;fill($('#vol'));$('#vol').oninput=e=>{S.vol=+e.target.value;fill(e.target);ready&&yt.setVolume(S.vol);au.volume=S.vol/100;save()};
au.volume=S.vol/100;au.onplay=()=>{playing=true;setPlay()};au.onpause=()=>{playing=false;setPlay()};au.onended=()=>{S.repeat===2?(au.currentTime=0,au.play()):next(true)};au.onerror=()=>{if(au.getAttribute('src')){toast('Track unavailable, skipping');next(true)}};
$('#pp').onclick=toggle;$('#next').onclick=()=>next(false);$('#prev').onclick=prev;
$('#shuf').onclick=()=>{S.shuffle=!S.shuffle;save();ui()};$('#rep').onclick=()=>{S.repeat=(S.repeat+1)%3;save();ui()};

/* ---------- library ops ---------- */
function toggleLike(t){const was=isLiked(t.id);S.liked=was?S.liked.filter(x=>x.id!==t.id):[t,...S.liked];save();toast(was?'Removed from Liked Songs':'Added to Liked Songs');
 document.querySelectorAll('[data-a=like]').forEach(b=>{const x=(L[b.dataset.l]||[])[b.dataset.i];if(x)b.classList.toggle('on',isLiked(x.id))});ui();if(view.n==='liked'||view.n==='library')render()}
function newPl(t){const name=prompt('Playlist name');if(!name||!name.trim())return;const p={id:'p'+Date.now(),name:name.trim().slice(0,60),tracks:t?[t]:[]};S.pl.push(p);save();if(t){toast('Added to '+p.name);side()}else go('pl',p.id)}
const curPl=()=>S.pl.find(p=>p.id===view.a);
function openMenu(btn,t,l){menuT=t;menuL=l;const m=$('#menu');const it=[['queue','Add to queue'],['next','Play next'],['like',isLiked(t.id)?'Remove from Liked Songs':'Add to Liked Songs'],...S.pl.map(p=>['pl:'+p.id,'Add to '+p.name])];if(view.n==='pl'&&l==='pl')it.push(['rm','Remove from this playlist']);it.push(['new','New playlist with this song']);
 m.innerHTML=it.map(([k,x])=>`<button data-m="${esc(k)}">${esc(x)}</button>`).join('');m.classList.add('on');const r=btn.getBoundingClientRect();m.style.top=Math.max(8,Math.min(r.bottom,innerHeight-m.offsetHeight-8))+'px';m.style.left=Math.max(8,Math.min(r.right-230,innerWidth-240))+'px'}
function menuAct(k){const t=menuT;$('#menu').classList.remove('on');if(!t)return;
 if(k==='queue'){S.queue.push(t);if(S.idx<0)S.idx=0,playAt(0);save();toast('Added to queue');panelOpen&&panel()}
 else if(k==='next'){S.queue.splice(S.idx+1,0,t);if(S.idx<0)playAt(0);save();toast('Playing next');panelOpen&&panel()}
 else if(k==='like')toggleLike(t);else if(k==='new')newPl(t);
 else if(k==='rm'){const p=curPl();p.tracks=p.tracks.filter(x=>x.id!==t.id);save();render()}
 else if(k.startsWith('pl:')){const p=S.pl.find(x=>x.id===k.slice(3));if(p.tracks.some(x=>x.id===t.id))toast('Already in '+p.name);else{p.tracks.push(t);save();toast('Added to '+p.name)}}}

/* ---------- panel (queue + lyrics) ---------- */
function showPanel(t){if(panelOpen&&tab===t)panelOpen=false;else{panelOpen=true;tab=t}$('#panel').classList.toggle('open',panelOpen);panel()}
function panel(){if(!panelOpen)return;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('act',b.dataset.t===tab&&b.closest('.tabs')));
 if(tab==='queue'){L.q=S.queue;$('#pbody').innerHTML=S.queue.length?`<div style="text-align:right"><button class="btn" data-a="clearq">Clear queue</button></div>`+rows(S.queue,'q'):'<p class="empty">Your queue is empty.</p>'}else lyrics()}
const LC={},clean=s=>s.replace(/\(.*?\)|\[.*?\]|official.*|lyrics?|video|audio|(ft|feat)\..*|\|.*/gi,'').replace(/\s+/g,' ').trim();
async function lyrics(){const t=cur(),b=$('#pbody');if(!t){b.innerHTML='<p class="empty">Play a song to see its lyrics.</p>';return}
 if(!(t.id in LC)){b.innerHTML='<p class="empty">Finding lyrics…</p>';try{const j=await J('https://lrclib.net/api/search?q='+encodeURIComponent(clean(t.title)+' '+clean(t.artist)));LC[t.id]=(j.find(x=>x.plainLyrics)||{}).plainLyrics||null}catch(e){if(cur()===t&&tab==='lyrics')b.innerHTML='<p class="empty">Couldn’t reach the lyrics service. Check your connection and reopen this tab.</p>';return}}
 if(cur()!==t||tab!=='lyrics')return;b.innerHTML=LC[t.id]?`<pre class="ly">${esc(LC[t.id])}</pre>`:'<p class="empty">No lyrics found for this track.</p>'}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const m=e.target.closest('[data-m]');if(m)return menuAct(m.dataset.m);
 if(!e.target.closest('[data-a=menu]'))$('#menu').classList.remove('on');
 const tb=e.target.closest('[data-t]');if(tb)return showPanel(tb.dataset.t);
 const v=e.target.closest('[data-v]');if(v&&!v.dataset.a){if(v.dataset.v==='search'){view={n:'search',q:$('#q').value.trim()};render();$('#q').focus()}else go(v.dataset.v);return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,l=b.dataset.l,i=+b.dataset.i,t=l&&(L[l]||[])[i];
 if(a==='play')playList(l,i);else if(a==='like')toggleLike(t);else if(a==='menu')openMenu(b,t,l);
 else if(a==='likecur'&&cur())toggleLike(cur());else if(a==='nav')go(b.dataset.v);else if(a==='openpl')go('pl',b.dataset.id);
 else if(a==='newpl')newPl();else if(a==='playall')playList(l,0);else if(a==='clearq'){S.queue=S.queue.filter((x,k)=>k===S.idx);S.idx=S.queue.length?0:-1;save();panel()}
 else if(a==='ren'){const p=curPl(),n=prompt('Rename playlist',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,60);save();render()}}
 else if(a==='del'){if(confirm('Delete this playlist?')){S.pl=S.pl.filter(p=>p!==curPl());save();go('library')}}
 else if(a==='src'){S.src=S.src==='au'?'yt':'au';save();updSrc();render()}
 else if(a==='key'){const k=prompt('YouTube Data API v3 key (optional, leave empty to use public sources)',S.key);if(k!==null){S.key=k.trim();save();SC.clear();render()}}});
let st;$('#q').addEventListener('input',e=>{clearTimeout(st);const q=e.target.value.trim();st=setTimeout(()=>{view={n:'search',q};render()},350)});
$('#q').addEventListener('focus',()=>{if(view.n!=='search'){view={n:'search',q:$('#q').value.trim()};render()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();toggle()}});

/* ---------- init ---------- */
const N=[['home','Home'],['search','Search'],['lib','Your Library'],['heart','Liked Songs'],['plus','Create Playlist']];
document.querySelectorAll('#side nav button').forEach((b,k)=>{b.innerHTML=ic(N[k][0],20)+`<span>${N[k][1]}</span>`});
$('#side nav button:nth-child(3)').dataset.v='library';$('#side nav button:nth-child(4)').dataset.v='liked';
$('#si').innerHTML=ic('search',18);$('#keyb').innerHTML=ic('key',18);$('#shuf').innerHTML=ic('shuffle');$('#prev').innerHTML=ic('prev');$('#next').innerHTML=ic('next');
$('#nl').innerHTML=ic('heart');$('#lb').innerHTML=ic('lyr');$('#qb').innerHTML=ic('queue');$('#vi').innerHTML=ic('vol',18);
if(S.idx>=S.queue.length)S.idx=-1;updSrc();render();ui();
</script></body></html>
